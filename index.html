<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafafa"><meta name="description" content="PDF 阅读与标注"><title>ADHD Reader</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./assets/app.css"></head>
<body><div id="app">
<header class="topbar"><button class="brand" id="home" title="文件">ADHD Reader</button><div id="doc-title"></div><div class="header-actions"><button id="open" class="icon-button" title="打开 PDF · Ctrl O" aria-label="打开 PDF" data-icon="folder" hidden></button><button id="theme" class="icon-button" title="夜间模式" aria-label="夜间模式" data-icon="moon"></button><button id="settings-toggle" class="icon-button" title="阅读设置" aria-label="阅读设置" data-icon="sliders"></button><button id="save" class="primary small" hidden><span data-icon="download"></span>保存 PDF<span id="dirty-dot" hidden>·</span></button></div></header>
<main id="welcome"><div class="welcome-content"><button id="drop-zone" aria-label="打开或拖入 PDF" title="打开或拖入 PDF"><span class="open-label"><span data-icon="plus"></span>打开 PDF</span></button><div id="recent-list"></div></div></main>
<section id="reader" hidden><div class="toolstrip"><div class="tool-group"><button id="focus" class="tool-button active" title="行引导 · F" aria-pressed="true"><span data-icon="focus"></span><span>行引导</span></button><div class="separator"></div><button data-tool="select" class="icon-button active" title="选取 · V" aria-label="选取" data-icon="cursor"></button><button data-tool="highlight" class="icon-button" title="高亮 · H" aria-label="高亮" data-icon="highlight"></button><button data-tool="underline" class="icon-button" title="下划线 · U" aria-label="下划线" data-icon="underline"></button><button data-tool="comment" class="icon-button" title="评论 · N" aria-label="评论" data-icon="comment"></button><button data-tool="erase" class="icon-button" title="擦除 · E" aria-label="擦除" data-icon="eraser"></button><button id="color" class="color-button" title="高亮颜色" aria-label="高亮颜色" hidden></button></div><div class="tool-group"><button id="zoom-out" class="icon-button compact" title="缩小" aria-label="缩小" data-icon="minus"></button><button id="zoom-fit" class="zoom-label" title="适合宽度">100%</button><button id="zoom-in" class="icon-button compact" title="放大" aria-label="放大" data-icon="plus"></button><div class="separator"></div><button id="notes-toggle" class="icon-button" title="标注列表" aria-label="标注列表" data-icon="sidebar"></button></div></div><div id="reading-area"><div id="scroll-area" tabindex="0" aria-label="PDF 阅读区域"><div id="page-shell"><div id="document-pages"></div></div><div id="page-message" hidden></div></div><aside id="notes-panel" hidden><div class="panel-heading"><h2>标注</h2><button id="notes-close" class="icon-button" aria-label="关闭标注列表" data-icon="close"></button></div><div id="notes-list"></div></aside></div><footer class="reader-footer"><div class="page-nav"><button id="prev-page" class="icon-button compact" title="上一页" aria-label="上一页" data-icon="left"></button><span class="page-value"><input id="page-number" aria-label="页码" inputmode="numeric" value="1"><span id="page-count">/ 1</span></span><button id="next-page" class="icon-button compact" title="下一页" aria-label="下一页" data-icon="right"></button></div><span id="line-position" hidden></span><span id="save-status"></span></footer></section>
<div id="settings" class="popover settings" hidden><div class="panel-heading"><h2>阅读设置</h2><button id="settings-close" class="icon-button" aria-label="关闭设置" data-icon="close"></button></div><label class="setting-row"><span>周围淡化</span><output id="dim-value">72%</output><input id="dim" type="range" min="15" max="95" value="72"></label></div>
<div id="selection-menu" class="popover selection-menu" hidden><button data-action="highlight" title="高亮" aria-label="高亮所选文字" data-icon="highlight"></button><button data-action="underline" title="下划线" aria-label="为所选文字加下划线" data-icon="underline"></button><button data-action="comment" title="评论" aria-label="评论所选文字" data-icon="comment"></button><span></span><button data-action="translate" title="翻译 · Enter" aria-label="翻译所选文字" data-icon="translate"></button><button data-action="copy" title="复制" aria-label="复制所选文字" data-icon="copy"></button></div>
<div id="annotation-menu" class="popover annotation-menu" hidden><button id="annotation-comment" type="button"><span data-icon="comment"></span>评论</button><button id="annotation-delete" type="button"><span data-icon="trash"></span>删除</button></div>
<div id="translation" class="popover translation" hidden><div class="translation-head"><strong id="translation-word"></strong><button id="translation-close" class="icon-button compact" aria-label="关闭翻译" data-icon="close"></button></div><p id="translation-result"></p></div>
<dialog id="comment-dialog"><form method="dialog"><div class="panel-heading"><h2>评论</h2><button class="icon-button" value="cancel" aria-label="取消" data-icon="close"></button></div><blockquote id="comment-quote"></blockquote><textarea id="comment-text" placeholder="评论" rows="5" aria-label="评论内容"></textarea><div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="comment-save" type="button" class="primary">保存评论</button></div></form></dialog>
<dialog id="password-dialog"><form><h2>输入 PDF 密码</h2><input id="password" type="password" autocomplete="off" aria-label="PDF 密码"><div class="dialog-actions"><button type="button" id="password-cancel" class="secondary">取消</button><button class="primary">打开</button></div></form></dialog>
<div id="busy" hidden><span class="spinner"></span><span id="busy-label">正在打开</span></div><div id="toast" role="status" hidden></div><input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
</div><script type="module" src="./assets/app.js"></script></body></html>
